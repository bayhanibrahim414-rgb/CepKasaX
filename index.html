<style>

/* --- GİRİŞ EKRANI (DARK GLASSMORPHISM) --- */
#loginPage {

.glass-panel {

.glass-panel.active { display: block; }

.brand-title {

}

.search-wrapper { position: relative; margin-bottom: 15px; }

}
.glass-input {

}
.glass-input.with-icon { padding-left: 42px; }

.glass-input:focus { border-color: #22c55e; background: rgba(255, 255, 255, 0.1); }

.btn-glass {

}
.btn-glass:active { transform: scale(0.97); }

}

.qty-btn:active { background: #cbd5e1; }
.qty-input {

}
.qty-input::-webkit-outer-spin-button, .qty-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

.btn { border: none; border-radius: 12px; padding: 14px; width: 100%; font-size: 15px; font-weight: 700; cursor: pointer; }
.btn-add { background: #0f172a; color: white; margin-top: 5px; }
.btn-history { background: white; color: #0f172a; border: 1px solid #e2e8f0; margin-top: 12px; }

.btn-pdf { background: #dc2626; color: white; margin-top: 8px; }

.history { display: none; }
.history.active { display: block; }
.history-card { background: white; padding: 16px; border-radius: 16px; margin-bottom: 12px; border: 1px solid #e2e8f0; }
.history-date { font-weight: 800; }
.history-total { color: #16a34a; font-size: 20px; font-weight: 800; margin-top: 6px; }
.empty { text-align: center; color: #64748b; padding: 30px 10px; font-size: 14px;}

.bottom-bar { position: fixed; bottom: 0; left: 0; width: 100%; padding: 12px 18px 24px; background: rgba(255,255,255,.94); backdrop-filter: blur(15px); border-top: 1px solid #e2e8f0; }
.bottom-content { max-width: 650px; margin: auto; display: flex; justify-content: space-between; align-items: center; }
.bottom-label { font-size: 13px; color: #64748b; }
.bottom-total { font-size: 22px; font-weight: 900; color: #16a34a; }

@media(max-width: 400px) {
    .sale-bottom { grid-template-columns: 1fr 1fr; }
    .line-total { grid-column: span 2; text-align: left; }
}
</style>
</head>

<body>

<!-- ONAY PENCERESİ -->
<div id="confirmModal" class="modal-overlay">
    <div class="glass-panel modal-panel active">
        <h2 id="modalTitle">Emin misin?</h2>
        <p id="modalDesc">Bu işlemi geri alamazsınız.</p>
        
        <input type="password" id="modalInput" class="glass-input center" style="display:none; margin-bottom:20px;" placeholder="Şirket Şifresi" maxlength="6" inputmode="numeric">
        
        <div class="modal-buttons">
            <button class="btn-glass cancel" onclick="closeConfirm()" style="margin-bottom:0;">İptal</button>
            <button class="btn-glass danger" onclick="executeConfirm()" style="margin-bottom:0;">Onayla</button>
        </div>
    </div>
</div>

<!-- GİRİŞ EKRANI (autocomplete engellenmiş) -->
<div id="loginPage">
    <div class="glass-panel active" id="panelList">
        <h1 class="brand-title">CepkasaX</h1>
        <div class="brand-subtitle">Şirket Seçimi</div>
        
        <div class="search-wrapper">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" class="glass-input with-icon" placeholder="Şirket ara..." oninput="renderCompanyList()" autocomplete="off">
        </div>
        
        <button class="btn-glass add-new" onclick="showPanel('panelAdd')">+ Şirket Ekle</button>
        
        <div id="companyList" class="company-list"></div>
    </div>

    <div class="glass-panel" id="panelAdd">
        <h1 class="brand-title">CepkasaX</h1>
        <div class="brand-subtitle">Yeni Şirket Ekle</div>
        
        <input type="text" id="newCompName" class="glass-input center" placeholder="Şirket Adı" autocomplete="off">
        <input type="password" id="newCompPin" class="glass-input center" placeholder="6 Haneli Şifre Belirle" maxlength="6" inputmode="numeric" autocomplete="new-password">
        <button class="btn-glass" onclick="createNewCompany()">Oluştur</button>
        <button class="btn-glass cancel" onclick="showPanel('panelList')">İptal</button>
    </div>

    <div class="glass-panel" id="panelLogin">
        <h2 id="loginTitle">Şifre Girin</h2>
        <input type="password" id="loginPin" class="glass-input center" placeholder="6 Haneli Şifre" maxlength="6" inputmode="numeric" autocomplete="current-password" onkeydown="if(event.key === 'Enter') verifyLogin()">
        <button class="btn-glass" onclick="verifyLogin()">Giriş Yap</button>
        <button class="btn-glass cancel" onclick="showPanel('panelList')">İptal</button>

</div>

<!-- ANA UYGULAMA -->
<div id="appContainer">
    <div class="app">
        <div class="header">
            <div class="header-top">
                <h1 id="companyTitle">🏢 Şirket Adı</h1>
                <button class="btn-exit" onclick="logout()" title="Çıkış Yap">×</button>
            </div>
            <div class="date" id="todayDate"></div>
            <div class="total-card">
                <div class="total-label">BUGÜNKÜ TOPLAM SATIŞ</div>
                <div class="total-price" id="headerTotal">₺0,00</div>
            </div>
        </div>

        <div class="content">
            <div id="salesPage">
                <div class="section-title">Bugünkü Ürünler</div>
                <div id="salesList"></div>
                <button class="btn btn-add" onclick="addSale()">+ Yeni Ürün Ekle</button>
                <button class="btn btn-history" onclick="showHistory()">📅 Geçmiş Günler ve Raporlar</button>
            </div>

            <div id="historyPage" class="history">
                <div class="section-title">📅 Geçmiş Raporlar ve Dökümler</div>
                
                <!-- RAPORLAMA BUTONLARI -->
                <div style="background: white; padding: 15px; border-radius: 16px; margin-bottom: 15px; border: 1px solid #e2e8f0;">
                    <div style="font-weight: 800; margin-bottom: 10px; font-size: 15px;">📊 Excel / PDF Rapor Al</div>
                    <button class="btn btn-excel" onclick="exportReport('excel')">📥 Excel'e Aktar (Tüm Veriler)</button>
                    <button class="btn btn-pdf" onclick="exportReport('pdf')">🖨️ PDF Rapor / Yazdır</button>
                </div>

                <div id="historyList"></div>
                <button class="btn btn-add" onclick="showSales()">← Bugüne Dön</button>

    <div class="bottom-bar">
        <div class="bottom-content">
            <div><div class="bottom-label">GÜNLÜK TOPLAM</div></div>
            <div class="bottom-total" id="bottomTotal">₺0,00</div>
        </div>
    </div>
</div>

<script>
const USE_FIREBASE = true; 

const FIREBASE_CONFIG = {
    apiKey: "AIzaSyBBMA96J2T2sx2v5cWg4VltVGZugqsPkrA",
    authDomain: "satispratik-2f76d.firebaseapp.com",
    databaseURL: "https://satispratik-2f76d-default-rtdb.firebaseio.com",
    projectId: "satispratik-2f76d",
    storageBucket: "satispratik-2f76d.firebasestorage.app",
    messagingSenderId: "236261356751",
    appId: "1:236261356751:web:417421029ecb510ae1f3ba",
    measurementId: "G-35CZYG9K6J"
};

let db = null;
if (USE_FIREBASE) {
    try {
        firebase.initializeApp(FIREBASE_CONFIG);
        db = firebase.database();
    } catch (error) {
        console.warn("Firebase bağlantısı kurulamadı.");
    }
}

let confirmActionCallback = null;
let confirmRequiresPin = false;
let confirmPinValue = "";

function openConfirm(title, description, actionCallback, requirePin = false, expectedPin = "") {
    document.getElementById("modalTitle").innerText = title;
    document.getElementById("modalDesc").innerText = description;
    confirmActionCallback = actionCallback;
    confirmRequiresPin = requirePin;
    confirmPinValue = expectedPin;
    
    const pinInput = document.getElementById("modalInput");
    if (requirePin) {
        pinInput.style.display = "block";
        pinInput.value = "";
        setTimeout(() => pinInput.focus(), 150);
    } else {
        pinInput.style.display = "none";
    }
    document.getElementById("confirmModal").classList.add("active");
}

function closeConfirm() {
    confirmActionCallback = null;
    document.getElementById("confirmModal").classList.remove("active");
}

function executeConfirm() {
    if (confirmRequiresPin) {
        const entered = document.getElementById("modalInput").value.trim();
        if (entered !== confirmPinValue) {
            alert("Hatalı Şifre Girdiniz! Şirket silinemez.");
            return;
        }
    }
    if (confirmActionCallback) confirmActionCallback();
    closeConfirm();
}

let companies = [];
let activeCompany = null; 
let STORAGE_KEY = ""; 

function loadCompanies() {
    const localData = JSON.parse(localStorage.getItem("app_companies")) || [];
    if (localData.length > 0) {
        companies = localData;
        renderCompanyList();
    }

    if (USE_FIREBASE && db) {
        db.ref('companies').on('value', (snapshot) => {
            const data = snapshot.val() || [];
            companies = Array.isArray(data) ? data : Object.values(data);
            localStorage.setItem("app_companies", JSON.stringify(companies));
            renderCompanyList();
        });
    }
}

function saveCompanies() { 
    localStorage.setItem("app_companies", JSON.stringify(companies));
    if (USE_FIREBASE && db) {
        db.ref('companies').set(companies).catch(err => console.warn("İnternete gönderilemedi."));
    }
}

function showPanel(panelId) {
    document.querySelectorAll('#loginPage .glass-panel').forEach(p => p.classList.remove('active'));
    document.getElementById(panelId).classList.add("active");
    document.querySelectorAll('#loginPage input').forEach(i => i.value = "");
}

function renderCompanyList() {
    const list = document.getElementById("companyList");
    const query = document.getElementById("searchInput").value.toLowerCase();
    list.innerHTML = "";

    const filtered = companies.filter(c => c && c.name && c.name.toLowerCase().includes(query));

    if (filtered.length === 0) {
        list.innerHTML = `<div style="text-align:center; color:#94a3b8; margin-top:10px;">Henüz şirket yok.</div>`;
        return;
    }

    filtered.forEach(c => {
        const div = document.createElement("div");
        div.className = "company-item";
        div.onclick = () => {
            activeCompany = c;
            document.getElementById("loginTitle").innerText = c.name;
            showPanel("panelLogin");
            setTimeout(() => document.getElementById("loginPin").focus(), 100);
        };
        
        div.innerHTML = `
            <span>${escapeHTML(c.name)}</span>
            <button class="btn-del-comp" onclick="requestDeleteCompany('${c.id}', event, '${c.pin}')">-</button>
        `;
        list.appendChild(div);
    });
}

function createNewCompany() {
    const name = document.getElementById("newCompName").value.trim();
    const pin = document.getElementById("newCompPin").value.trim();

    if (!name) return alert("Şirket adı boş olamaz!");
    if (!/^\d{6}$/.test(pin)) return alert("Şifre 6 haneli rakam olmalıdır!");

    companies.push({ id: "comp_" + Date.now(), name: name, pin: pin });
    saveCompanies(); 
    renderCompanyList(); 
    showPanel("panelList");
}

function requestDeleteCompany(id, event, pin) {
    event.stopPropagation();
    openConfirm(
        "Şirketi Sil", 
        "Bu şirketi silmek için kurarken belirlediğiniz 6 haneli şifreyi girmelisiniz.", 
        () => {
            companies = companies.filter(c => c.id !== id);
            saveCompanies();
            renderCompanyList();
        },
        true, 
        pin   
    );
}

function verifyLogin() {
    const pinInput = document.getElementById("loginPin").value.trim();
    if (pinInput === activeCompany.pin) startApp(activeCompany);
    else alert("Hatalı Şifre!");
}

function logout() {
    document.getElementById("appContainer").style.display = "none";
    document.getElementById("loginPage").style.display = "flex";
    showPanel("panelList");
    STORAGE_KEY = "";
}

loadCompanies();

let isTyping = false;

function handleBlur() {
    isTyping = false;
    setTimeout(() => {
        if (!isTyping) renderSales();
    }, 150);
}

function startApp(company) {
    STORAGE_KEY = "data_" + company.id;
    document.getElementById("loginPage").style.display = "none";
    document.getElementById("appContainer").style.display = "block";
    document.getElementById("companyTitle").innerText = `🏢 ${company.name}`;
    
    showDate();
    renderSales();
    
    if (USE_FIREBASE && db) {
        db.ref('sales/' + company.id).on('value', (snapshot) => {
            const incomingData = snapshot.val() || {};
            localStorage.setItem(STORAGE_KEY, JSON.stringify(incomingData));
            
            if (!isTyping) {
                renderSales();
                if(document.getElementById("historyPage").classList.contains("active")) renderHistory();
            }
        });
    }
}

function getTodayKey() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

function formatDate(dateKey) {
    const [y, m, d] = dateKey.split("-");
    return `${d}.${m}.${y}`;
}

function getData() { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }

function saveTodaySales(sales) {
    const data = getData();
    const today = getTodayKey();
    data[today] = sales;
    
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));

    if (USE_FIREBASE && db) {
        db.ref('sales/' + activeCompany.id + '/' + today).set(sales);
    }
}

function getTodaySales() {
    const data = getData();
    return data[getTodayKey()] || [];
}

function money(val) { return new Intl.NumberFormat("tr-TR", { style: "currency", currency: "TRY" }).format(val || 0); }

function showDate() {
    document.getElementById("todayDate").innerText = new Date().toLocaleDateString("tr-TR", { weekday: "long", year: "numeric", month: "long", day: "numeric" });
}

/* YENİ ÜRÜN EKLENDİĞİNDE ADET ARTIK 0 İLE BAŞLIYOR */
function addSale(product = "", price = "", quantity = 0) {
    const sales = getTodaySales();
    sales.push({ product, price, quantity });
    saveTodaySales(sales);
    renderSales(); 
}

function requestDeleteSale(index) {
    const sales = getTodaySales();
    const productName = sales[index].product || "Bu ürünü";
    
    openConfirm(
        "Ürünü Kaldır", 
        `"${productName}" adlı satışı kaldırmak istediğine emin misin?`, 
        () => {
            sales.splice(index, 1);
            saveTodaySales(sales);
            renderSales();
        }
    );
}

function changeQty(index, amount) {
    const sales = getTodaySales();
    let currentQty = Number(sales[index].quantity) || 0;
    let nextQty = currentQty + amount;
    if (nextQty < 0) nextQty = 0; 
    
    sales[index].quantity = nextQty;
    saveTodaySales(sales);
    
    const qtyInputs = document.querySelectorAll(".qty-input");
    if(qtyInputs[index]) qtyInputs[index].value = nextQty;
    updateTotalsDOM(sales, index);
}

function updateSale(index, field, value) {
    const sales = getTodaySales();
    if (field === "price" || field === "quantity") value = value === "" ? "" : Number(value);
    sales[index][field] = value;
    saveTodaySales(sales);
    updateTotalsDOM(sales, index); 
}

function updateTotalsDOM(sales, index) {
    const totals = document.querySelectorAll(".line-total");
    if (totals[index]) {
        totals[index].innerText = money((Number(sales[index].price) || 0) * (Number(sales[index].quantity) || 0));
    }
    const total = sales.reduce((sum, sale) => sum + ((Number(sale.price) || 0) * (Number(sale.quantity) || 0)), 0);
    document.getElementById("headerTotal").innerText = money(total);
    document.getElementById("bottomTotal").innerText = money(total);
}

function renderSales() {
    const list = document.getElementById("salesList");
    const sales = getTodaySales();
    list.innerHTML = "";

    if (sales.length === 0) {
        list.innerHTML = `<div class="empty">Henüz ürün eklenmedi.<br>İlk satışını eklemek için aşağıdaki butona bas.</div>`;
    } else {
        sales.forEach((sale, index) => {
            const lineTotal = (Number(sale.price) || 0) * (Number(sale.quantity) || 0);
            const card = document.createElement("div");
            card.className = "sale-card";
            card.innerHTML = `
                <button class="delete-btn" onclick="requestDeleteSale(${index})" title="Sil">×</button>
                <div class="sale-top">
                    <input class="input" placeholder="Ürün adı" value="${escapeHTML(sale.product || "")}" 
                        onfocus="isTyping = true" onblur="handleBlur()" oninput="updateSale(${index}, 'product', this.value)">
                </div>
                <div class="sale-bottom">
                    <div>
                        <span class="small-label">Birim Fiyat</span>
                        <input class="input" type="number" inputmode="decimal" placeholder="₺" value="${sale.price || ""}" 
                            onfocus="isTyping = true" onblur="handleBlur()" oninput="updateSale(${index}, 'price', this.value)">
                    </div>
                    <div>
                        <span class="small-label">Adet</span>
                        <div class="qty-group">
                            <button class="qty-btn" onclick="changeQty(${index}, -1)">-</button>
                            <input class="qty-input" type="number" inputmode="numeric" min="0" value="${sale.quantity !== undefined ? sale.quantity : 0}" 
                                onfocus="isTyping = true" onblur="handleBlur()" oninput="updateSale(${index}, 'quantity', this.value)">
                            <button class="qty-btn" onclick="changeQty(${index}, 1)">+</button>
                        </div>
                    </div>
                    <div class="line-total">${money(lineTotal)}</div>
                </div>
            `;
            list.appendChild(card);
        });
    }
    
    const total = sales.reduce((sum, sale) => sum + ((Number(sale.price) || 0) * (Number(sale.quantity) || 0)), 0);
    document.getElementById("headerTotal").innerText = money(total);
    document.getElementById("bottomTotal").innerText = money(total);
}

function showHistory() {
    document.getElementById("salesPage").style.display = "none";
    document.getElementById("historyPage").classList.add("active");
    renderHistory();
}

function showSales() {
    document.getElementById("historyPage").classList.remove("active");
    document.getElementById("salesPage").style.display = "block";
}

function renderHistory() {
    const data = getData();
    const historyList = document.getElementById("historyList");
    historyList.innerHTML = "";
    const days = Object.keys(data).sort().reverse();

    if (days.length === 0) {
        historyList.innerHTML = `<div class="empty">Henüz kayıtlı satış günü yok.</div>`;
        return;
    }

    days.forEach(day => {
        const sales = data[day];
        const total = sales.reduce((sum, sale) => sum + ((Number(sale.price) || 0) * (Number(sale.quantity) || 0)), 0);
        const card = document.createElement("div");
        card.className = "history-card";
        card.innerHTML = `
            <div class="history-date">📅 ${formatDate(day)}</div>
            <div class="history-total">${money(total)}</div>
            <div style="margin-top:8px; color:#64748b; font-size:13px;">${sales.length} ürün kaydı</div>
        `;
        historyList.appendChild(card);
    });
}

/* EXCEL VE PDF DIŞA AKTARIM FONKSİYONLARI */
function exportReport(type) {
    const data = getData();
    const days = Object.keys(data).sort().reverse();

    if (days.length === 0) {
        alert("Dışa aktarılacak kayıt bulunmuyor!");
        return;
    }

    if (type === 'excel') {
        // CSV (Excel uyumlu) formatı oluşturma
        let csvContent = "Tarih;Urun Adi;Birim Fiyat;Adet;Toplam Tutar\n";
        days.forEach(day => {
            const sales = data[day];
            sales.forEach(s => {
                const pName = (s.product || "Ürün").replace(/;/g, ",");
                const pPrice = s.price || 0;
                const pQty = s.quantity || 0;
                const pTotal = pPrice * pQty;
                csvContent += `${formatDate(day)};${pName};${pPrice};${pQty};${pTotal}\n`;
            });
        });

        const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.setAttribute("href", url);
        a.setAttribute("download", `${activeCompany.name}_satis_raporu.csv`);
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

    } else if (type === 'pdf') {
        // PDF / Yazdırma penceresi oluşturma
        let printWindow = window.open('', '_blank');
        let htmlContent = `
            <html>
            <head>
                <title>${activeCompany.name} - Satış Raporu</title>
                <style>
                    body { font-family: Arial, sans-serif; padding: 20px; color: #0f172a; }
                    h2 { color: #16a34a; border-bottom: 2px solid #16a34a; padding-bottom: 5px; }
                    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
                    th, td { border: 1px solid #cbd5e1; padding: 10px; text-align: left; font-size: 14px; }
                    th { background: #f8fafc; }
                    .total { font-weight: bold; margin-top: 20px; font-size: 16px; }
                </style>
            </head>
            <body>
                <h2>🏢 ${activeCompany.name} - Satış Raporu</h2>
                <p>Oluşturulma Tarihi: ${new Date().toLocaleDateString("tr-TR")}</p>
        `;

        let grandTotal = 0;
        days.forEach(day => {
            const sales = data[day];
            let dayTotal = sales.reduce((sum, s) => sum + ((Number(s.price) || 0) * (Number(s.quantity) || 0)), 0);
            grandTotal += dayTotal;

            htmlContent += `<h3>📅 ${formatDate(day)} (Günlük Toplam: ${money(dayTotal)})</h3>`;
            htmlContent += `<table><tr><th>Ürün Adı</th><th>Birim Fiyat</th><th>Adet</th><th>Toplam</th></tr>`;
            sales.forEach(s => {
                const lineT = (Number(s.price) || 0) * (Number(s.quantity) || 0);
                htmlContent += `<tr><td>${escapeHTML(s.product || "-")}</td><td>${money(s.price)}</td><td>${s.quantity}</td><td>${money(lineT)}</td></tr>`;
            });
            htmlContent += `</table>`;
        });

        htmlContent += `<div class="total">Genel Toplam Ciro: ${money(grandTotal)}</div>`;
        htmlContent += `</body></html>`;

        printWindow.document.write(htmlContent);
        printWindow.document.close();
        printWindow.focus();
        setTimeout(() => {
            printWindow.print();
        }, 500);
    }
}

function escapeHTML(text) {
    const div = document.createElement("div");
    div.innerText = text;
    return div.innerHTML;
}
